name: Temporary Pint Autofix

on:
  push:
    branches:
      - fix/auditoria-lms-2026-09-21

permissions:
  contents: write

jobs:
  pint:
    if: "${{ github.event.head_commit.message != 'style: apply Pint fixes' }}"
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auditoria-lms-2026-09-21

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint
        run: |
          vendor/bin/pint             app/Filament/Resources/UserResource.php             app/Filament/Secretario/Resources/AlunoSecretariaResource/Pages/CreateAlunoSecretaria.php             app/Filament/Secretario/Resources/CadastroRapidoResource/Pages/CreateCadastroRapido.php             app/Filament/Secretario/Resources/MatriculaSecretariaResource.php             app/Filament/Secretario/Resources/MatriculaSecretariaResource/Pages/EditMatriculaSecretaria.php             app/Filament/Secretario/Widgets/SecretariaStatsWidget.php             app/Http/Controllers/Aluno/PerfilController.php             routes/console.php             tests/Feature/ExampleTest.php

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/Filament/Resources/UserResource.php             app/Filament/Secretario/Resources/AlunoSecretariaResource/Pages/CreateAlunoSecretaria.php             app/Filament/Secretario/Resources/CadastroRapidoResource/Pages/CreateCadastroRapido.php             app/Filament/Secretario/Resources/MatriculaSecretariaResource.php             app/Filament/Secretario/Resources/MatriculaSecretariaResource/Pages/EditMatriculaSecretaria.php             app/Filament/Secretario/Widgets/SecretariaStatsWidget.php             app/Http/Controllers/Aluno/PerfilController.php             routes/console.php             tests/Feature/ExampleTest.php
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Pint fixes"
            git push origin HEAD:fix/auditoria-lms-2026-09-21
          fi
