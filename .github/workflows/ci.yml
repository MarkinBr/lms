name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  APP_ENV: testing
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array
  FILESYSTEM_DISK: local

jobs:
  quality:
    name: PHP e JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Preparar diretórios Laravel
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar SQLite de teste
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force

      - name: Verificar sintaxe dos PHP alterados
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$(git rev-parse HEAD^)"; fi
          # Ignora arquivos removidos: eles não existem no checkout para o php -l.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.php')
          if [ "${#files[@]}" -gt 0 ]; then
            printf '%s\0' "${files[@]}" | xargs -0 -n1 php -l
          else
            echo "Nenhum arquivo PHP alterado neste PR."
          fi

      - name: Rodar Pint nos arquivos alterados
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$(git rev-parse HEAD^)"; fi
          # Mantém o Pint restrito aos PHP existentes e alterados.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.php')
          if [ "${#files[@]}" -gt 0 ]; then vendor/bin/pint --test "${files[@]}"; fi

      - name: Testes Laravel direcionados
        run: php artisan test --filter='Application|Contato|Newsletter|Acompanhamento|Inscricao|Auth|PortalAlunoPublico|SsoController|PortalRoutesPlaceholderTest|TelegramAdministrativo|TelegramMenuConsulta|TelegramOperacional|TelegramCentralInteligente|TelegramNavegacao35|TelegramAlertasPreferencias|TelegramOutbox|TelegramSegurancaRegressao|TelegramConfirmacoes|TelegramPreAnaliseInscricao|Legado'

      - name: Testes da infraestrutura isolada
        run: python3 -m unittest discover -s tests/infra -p 'test_*.py'

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Checar JavaScript público
        run: npm run check:js

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    env:
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Preparar diretórios Laravel
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar aplicação
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Iniciar servidor Laravel
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent "$E2E_BASE_URL/up" && exit 0; sleep 2; done
          cat storage/logs/e2e-server.log
          exit 1

      - name: Executar E2E
        run: npm run test:e2e

      - name: Publicar artefatos apenas em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/.report
            tests/e2e/.artifacts
            storage/logs/e2e-server.log
          if-no-files-found: ignore
