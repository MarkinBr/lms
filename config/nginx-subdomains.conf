# ═══════════════════════════════════════════════════════
# CETSADP — Configuração Nginx para Multi-Subdomínio
# ═══════════════════════════════════════════════════════
#
# Estrutura:
#   cetsadp.com.br                    → Site institucional
#   diaconato.cetsadp.com.br          → Portal Diaconato
#   lideranca.cetsadp.com.br          → Portal Liderança
#   teologia.cetsadp.com.br           → Portal Teologia
#   capelania.cetsadp.com.br          → Portal Capelania
#   admin.cetsadp.com.br              → Admin Global (Filament)
#   professor.cetsadp.com.br          → Hub do Professor
#
# Certificado SSL: Wildcard *.cetsadp.com.br via Let's Encrypt
# ═══════════════════════════════════════════════════════

# ── Redireciona HTTP → HTTPS ──
server {
    listen 80;
    server_name cetsadp.com.br *.cetsadp.com.br;
    return 301 https://$host$request_uri;
}

# ── Site Institucional (cetsadp.com.br) ──
server {
    listen 443 ssl http2;
    server_name cetsadp.com.br www.cetsadp.com.br;

    ssl_certificate     /etc/letsencrypt/live/cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cetsadp.com.br/privkey.pem;

    root /var/www/cetsadp/public;
    index index.php;

    # Cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Portais dos Cursos (*.cetsadp.com.br) ──
# Um único bloco atende todos os 4 subdomínios de curso
server {
    listen 443 ssl http2;
    server_name diaconato.cetsadp.com.br
                lideranca.cetsadp.com.br
                teologia.cetsadp.com.br
                capelania.cetsadp.com.br;

    ssl_certificate     /etc/letsencrypt/live/cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cetsadp.com.br/privkey.pem;

    root /var/www/cetsadp/public;
    index index.php;

    # O middleware IdentifyCurso do Laravel detecta o subdomínio
    # e injeta as configurações visuais automaticamente

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # WebSocket para chat ao vivo (Laravel Reverb/Pusher)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Admin Global (admin.cetsadp.com.br) ──
server {
    listen 443 ssl http2;
    server_name admin.cetsadp.com.br;

    ssl_certificate     /etc/letsencrypt/live/cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cetsadp.com.br/privkey.pem;

    root /var/www/cetsadp/public;
    index index.php;

    # Restrição por IP (opcional — acesso apenas da rede interna)
    # allow 192.168.1.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ── Hub do Professor (professor.cetsadp.com.br) ──
server {
    listen 443 ssl http2;
    server_name professor.cetsadp.com.br;

    ssl_certificate     /etc/letsencrypt/live/cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cetsadp.com.br/privkey.pem;

    root /var/www/cetsadp/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ═══════════════════════════════════════════════════════
# NOTAS:
#
# 1. Para gerar o certificado wildcard com Let's Encrypt:
#    sudo certbot certonly --dns-cloudflare \
#      -d cetsadp.com.br -d "*.cetsadp.com.br" \
#      --dns-cloudflare-credentials /etc/cloudflare.ini
#
# 2. DNS necessário no Cloudflare/registrador:
#    A     cetsadp.com.br           → IP do servidor
#    A     *.cetsadp.com.br         → IP do servidor
#    CNAME www.cetsadp.com.br       → cetsadp.com.br
#
# 3. No .env do Laravel, configure:
#    SESSION_DOMAIN=.cetsadp.com.br
#    (com ponto no início para cookies cross-subdomain)
#
# 4. Para WebSocket (chat ao vivo), configure Laravel Reverb:
#    REVERB_SERVER_HOST=0.0.0.0
#    REVERB_SERVER_PORT=8080
# ═══════════════════════════════════════════════════════
