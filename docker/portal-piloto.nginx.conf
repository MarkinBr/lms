# Piloto separado: os vhosts e upstreams antigos continuam inalterados.
server {
    listen 80;
    listen [::]:80;
    server_name novo.cetsadp.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://novo.cetsadp.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novo.cetsadp.com.br;
    ssl_certificate /etc/letsencrypt/live/novo.cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novo.cetsadp.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # IP real somente de proxies oficiais; limitações de login por aluno/IP.
    include /etc/nginx/conf.d/portal84-cloudflare-ips.inc;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal84_backend http://portal84-web-1:80;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    # O site institucional é servido pelo mesmo Laravel do Portal do Aluno.
    # Sem SMTP validado, contato não pode informar um envio fictício.
    location = /contato {
        default_type application/json;
        charset utf-8;
        if ($request_method = POST) {
            return 503 '{"success":false,"message":"O formulário de contato ainda não está disponível neste ambiente. Fale com a secretaria pelo telefone (21) 2683-3271 ou pelo e-mail contato@cetsadp.com.br."}';
        }
        proxy_pass $portal84_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # E-mail não foi configurado: não simular entrega bem-sucedida.
    location ^~ /senha/ {
        default_type text/plain;
        charset utf-8;
        return 503 "O envio de e-mail ainda não está disponível neste portal piloto. Entre com matrícula e senha ou procure a secretaria.\n";
    }
    location ^~ /portal/perfil/email {
        default_type text/plain;
        charset utf-8;
        return 503 "A confirmação de e-mail será liberada após a configuração do envio pela instituição. Sua matrícula continua válida para entrar.\n";
    }
    # Consultas financeiras funcionam; integração de cobrança ainda não configurada.
    location ~ ^/portal/financeiro/[0-9]+/(pix|boleto)$ {
        default_type application/json;
        charset utf-8;
        return 503 '{"success":false,"message":"A emissão de pagamentos ainda não foi configurada neste ambiente. Consulte a secretaria."}';
    }
    location ^~ /api/webhook/ { return 503; }
    location = /api/telegram/cetsadp/webhook {
        client_max_body_size 256k;
        limit_except POST { deny all; }
        proxy_pass $portal84_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location ^~ /api/telegram/ { return 404; }
    location ^~ /admin/password-reset/ {
        default_type text/plain;
        charset utf-8;
        return 503 "A recuperação por e-mail depende da configuração de envio. O login administrativo por senha continua disponível.\n";
    }
    location = /admin/token/request { return 503; }
    # Não expor arquivos ocultos; a autenticação dos painéis pertence ao Laravel.
    location ~ /\. { return 404; }

    # Encaminhar o LMS completo, incluindo Filament, Livewire e relatórios.
    location / {
        proxy_pass $portal84_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
