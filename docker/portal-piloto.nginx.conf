# Piloto separado: os vhosts e upstreams antigos continuam inalterados.
server {
    listen 80;
    listen [::]:80;
    server_name novo.cetsadp.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://novo.cetsadp.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novo.cetsadp.com.br;
    ssl_certificate /etc/letsencrypt/live/novo.cetsadp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novo.cetsadp.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # IP real somente de proxies oficiais; limitações de login por aluno/IP.
    include /etc/nginx/conf.d/portal84-cloudflare-ips.inc;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal84_backend http://portal84-web-1:80;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { return 302 /portal/login; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    # E-mail não foi configurado: não simular entrega bem-sucedida.
    location ^~ /senha/ {
        default_type text/plain;
        charset utf-8;
        return 503 "O envio de e-mail ainda não está disponível neste portal piloto. Entre com matrícula e senha ou procure a secretaria.\n";
    }
    location ^~ /portal/perfil/email {
        default_type text/plain;
        charset utf-8;
        return 503 "A confirmação de e-mail será liberada após a configuração do envio pela instituição. Sua matrícula continua válida para entrar.\n";
    }
    # Cobranças reais e administração continuam exclusivamente no sistema atual.
    location ^~ /portal/financeiro { return 503; }
    location ^~ /portal/perfil/solicitar-exclusao { return 503; }

    location ~ ^/(?:portal(?:/|$)|login$|up$|storage/|assets/|build/|css/|js/|vendor/|images/|favicon\.ico$) {
        proxy_pass $portal84_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    location / { return 404; }
}
